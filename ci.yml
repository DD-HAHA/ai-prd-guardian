name: ci
on: [push, pull_request]
jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt || true
      - run: pip install pydantic pytest
      - run: pytest -q
      - run: mkdir -p out examples/prd_samples
      - run: echo "# demo prd" > examples/prd_samples/sample1.md
      - run: python cli.py --input examples/prd_samples/sample1.md --output out/sample1.json
      - uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: out/sample1.json
